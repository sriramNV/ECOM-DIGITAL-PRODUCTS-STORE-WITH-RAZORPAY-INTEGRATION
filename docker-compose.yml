services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: pod
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?must be set}
      POSTGRES_DB: digital_products
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pod -d digital_products"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:?must be set}
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports: ["3000:3000"]
    volumes:
      - uploads:/data/uploads
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://pod:${POSTGRES_PASSWORD}@postgres:5432/digital_products
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      UPLOAD_DIR: /data/uploads
      AUTH_SECRET: ${AUTH_SECRET:?must be set}
      AUTH_URL: ${AUTH_URL:-http://localhost:3000}
      AUTH_TRUST_HOST: ${AUTH_TRUST_HOST:-false}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-dummy}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-dummy}
      NEXT_PUBLIC_RAZORPAY_KEY_ID: ${NEXT_PUBLIC_RAZORPAY_KEY_ID:-dummy}
      AUTH_GOOGLE_ID: ${AUTH_GOOGLE_ID:-dummy}
      AUTH_GOOGLE_SECRET: ${AUTH_GOOGLE_SECRET:-dummy}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  pgdata:
  uploads:
  redis_data:
