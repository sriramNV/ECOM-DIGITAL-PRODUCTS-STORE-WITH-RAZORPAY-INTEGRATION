services:
  - type: web
    name: pod-web
    env: docker
    dockerfilePath: ./Dockerfile
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: pod-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: pod-redis
          property: connectionString
      - key: UPLOAD_DIR
        value: /data/uploads
      - key: AUTH_SECRET
        value: a91f7e3b2c8d4f6e1a0b5c7d9e2f4a6b8c0d1e3f5a7b9c2d4e6f8a0b1c3d5e7
      - key: AUTH_URL
        value: https://ecom-digital-products-store-with.onrender.com
      - key: AUTH_TRUST_HOST
        value: "true"
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: AUTH_GOOGLE_ID
        sync: false
      - key: AUTH_GOOGLE_SECRET
        sync: false
    disk:
      name: uploads
      mountPath: /data
      sizeGB: 1
    healthCheckPath: /api/health
    autoDeploy: true

  - type: redis
    name: pod-redis
    plan: free
    ipAllowList: []

databases:
  - name: pod-db
    databaseName: digital_products
    user: pod
