services:
  - type: web
    name: pod-web
    env: docker
    dockerfilePath: ./Dockerfile
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: digital-estore
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: pod-redis
          property: connectionString
      - key: UPLOAD_DIR
        value: /data/uploads
      - key: AUTH_SECRET
        sync: false
      - key: AUTH_URL
        value: https://ecom-digital-products-store-with.onrender.com
      - key: AUTH_TRUST_HOST
        value: "false"
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: AUTH_GOOGLE_ID
        sync: false
      - key: AUTH_GOOGLE_SECRET
        sync: false
    disk:
      name: uploads
      mountPath: /data
      sizeGB: 1
    healthCheckPath: /api/health
    autoDeploy: true

  - type: redis
    name: pod-redis
    plan: free
    ipAllowList: []

databases:
  - name: digital-estore
    databaseName: digital_estore
    user: pod
